<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenkai Performance Tracker - Torso/Cama & Drive Sync</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --input-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 1100px; margin: 0 auto; line-height: 1.5; }

    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 2px solid var(--card-border); gap: 12px; }
    .brand-title { font-size: 1.5rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: -0.02em; }
    .phase-badge { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }

    .timer-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .timer-display { font-family: monospace; font-size: 2.2rem; font-weight: 800; color: var(--accent); background: var(--input-bg); padding: 4px 16px; border-radius: 8px; border: 1px solid var(--card-border); min-width: 130px; text-align: center; }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 6px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.9rem; white-space: nowrap; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #000; box-shadow: 0 0 12px var(--accent-glow); }

    .workout-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .exercise-table { width: 100%; border-collapse: collapse; margin-top: 8px; min-width: 650px; }
    .exercise-table th { text-align: left; padding: 10px 8px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--card-border); }
    .exercise-table td { padding: 12px 8px; border-bottom: 1px solid var(--card-border); vertical-align: middle; }

    input[type="number"], select { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 10px; border-radius: 6px; width: 75px; font-weight: 600; font-size: 0.9rem; outline: none; }
    input[type="number"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 5px var(--accent-glow); }

    .btn { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); }
    .btn-secondary:hover { background: var(--card-border); }
    .btn-drive { background: #137333; color: #fff; border: 1px solid #1e8e3e; }
    .btn-drive:hover { background: #1e8e3e; }

    .progression-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
    .badge-up { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
    .badge-keep { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .footer-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">ZENKAI PERFORMANCE TRACKER</div>
      <div class="phase-badge">Fase 1: Re-adaptació Neural & Hipertròfia</div>
    </div>
    <div style="font-size: 0.85rem; color: var(--text-muted); text-align: right;">
      Doble Progressió & Sincronització Drive
    </div>
  </header>

  <!-- Timer Card -->
  <div class="timer-card">
    <div>
      <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Cronòmetre de Descans</div>
      <div class="timer-display" id="timer">00:00</div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
      <button class="btn btn-secondary" onclick="startTimer(60)">60s</button>
      <button class="btn btn-secondary" onclick="startTimer(90)">90s</button>
      <button class="btn btn-secondary" onclick="startTimer(120)">2 min</button>
      <button class="btn btn-secondary" onclick="startTimer(180)">3 min</button>
      <button class="btn btn-secondary" style="color: var(--danger); border-color: var(--danger);" onclick="stopTimer()">Atura</button>
    </div>
  </div>

  <!-- Navigation -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('torsoA')">Dilluns: Torso A</button>
    <button class="tab-btn" onclick="switchTab('camaA')">Dimarts: Cama A</button>
    <button class="tab-btn" onclick="switchTab('torsoB')">Dijous: Torso B</button>
    <button class="tab-btn" onclick="switchTab('camaB')">Divendres: Cama B</button>
    <button class="tab-btn" onclick="switchTab('recuperacio')">Dimecres: Recuperació Activa</button>
  </div>

  <div id="workout-content"></div>

  <script>
    const routineData = {
      torsoA: {
        title: "Dilluns: Torso A",
        focus: "Empenta Horitzontal + Tirada Controlada",
        exercises: [
          { name: "Press de banca amb barra", series: 3, targetReps: "8-10", maxReps: 10, rest: 120, defaultWeight: 50 },
          { name: "Rem amb barra (prono/supí)", series: 3, targetReps: "8-10", maxReps: 10, rest: 90, defaultWeight: 40 },
          { name: "Press militar amb manuelles", series: 3, targetReps: "10-12", maxReps: 12, rest: 90, defaultWeight: 14 },
          { name: "Rem estirada pectoral TRX/manuelles", series: 3, targetReps: "10-12", maxReps: 12, rest: 60, defaultWeight: 12 },
          { name: "Superset: Curl Z + Extensió goma/Z", series: 3, targetReps: "12", maxReps: 12, rest: 60, defaultWeight: 18 }
        ]
      },
      camaA: {
        title: "Dimarts: Cama A",
        focus: "Dominant Genoll + Flexió Maluc",
        exercises: [
          { name: "Goblet Squat / Z-Squat (excèntrica lenta)", series: 3, targetReps: "10-12", maxReps: 12, rest: 100, defaultWeight: 18 },
          { name: "Pes mort romanès (RDL)", series: 3, targetReps: "8-10", maxReps: 10, rest: 120, defaultWeight: 50 },
          { name: "Zancadas posteriors amb manuelles", series: 3, targetReps: "10/cama", maxReps: 10, rest: 90, defaultWeight: 10 },
          { name: "Curl femoral amb goma o TRX", series: 3, targetReps: "12-15", maxReps: 15, rest: 60, defaultWeight: 0 },
          { name: "Roda d'abdominals (des de genolls)", series: 3, targetReps: "8-10", maxReps: 10, rest: 60, defaultWeight: 0 }
        ]
      },
      torsoB: {
        title: "Dijous: Torso B",
        focus: "Tirada Vertical + Empenta Vertical/Inclinada",
        exercises: [
          { name: "Rem invertit TRX / Rem 1 mà manuella", series: 3, targetReps: "8-10", maxReps: 10, rest: 90, defaultWeight: 16 },
          { name: "Press inclinat amb manuelles (30°)", series: 3, targetReps: "10-12", maxReps: 12, rest: 90, defaultWeight: 16 },
          { name: "Elevacions laterals amb manuelles", series: 4, targetReps: "12-15", maxReps: 15, rest: 60, defaultWeight: 8 },
          { name: "Face pulls amb goma de resistència", series: 3, targetReps: "15", maxReps: 15, rest: 60, defaultWeight: 0 },
          { name: "Superset: Curl TRX/manuella + Flexions diamant", series: 3, targetReps: "10-12", maxReps: 12, rest: 60, defaultWeight: 0 }
        ]
      },
      camaB: {
        title: "Divendres: Cama B",
        focus: "Cadena Posterior + Estabilitat Core",
        exercises: [
          { name: "Pes mort convencional amb barra", series: 3, targetReps: "6-8", maxReps: 8, rest: 150, defaultWeight: 60 },
          { name: "Bulgarian Split Squat", series: 3, targetReps: "10/cama", maxReps: 10, rest: 90, defaultWeight: 10 },
          { name: "Hip Thrust amb barra o kettlebell", series: 3, targetReps: "10-12", maxReps: 12, rest: 90, defaultWeight: 40 },
          { name: "Elevació de talons per bessons (1 cama)", series: 4, targetReps: "15", maxReps: 15, rest: 45, defaultWeight: 10 },
          { name: "Plancha TRX / Pallof press amb goma", series: 3, targetReps: "30s", maxReps: 30, rest: 60, defaultWeight: 0 }
        ]
      },
      recuperacio: {
        title: "Dimecres / Cap de Setmana: Recuperació Activa",
        focus: "Descompressió Espinal, Mobilitat d'Oficina & LISS",
        exercises: [
          { name: "Corda suau / LISS (10-15 minuts)", series: 1, targetReps: "15 min", maxReps: 15, rest: 60, defaultWeight: 0 },
          { name: "Rutina Mobilitat Espatlles/TRX + Obertura Malucs", series: 1, targetReps: "15 min", maxReps: 15, rest: 60, defaultWeight: 0 }
        ]
      }
    };

    let activeTab = 'torsoA';
    let timerInterval = null;

    function startTimer(seconds) {
      clearInterval(timerInterval);
      let timeLeft = seconds;
      updateTimerDisplay(timeLeft);
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert('⏰ Descans finalitzat! Torna a la barra amb concentració.');
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(0);
    }

    function updateTimerDisplay(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      document.getElementById('timer').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function switchTab(tabKey) {
      activeTab = tabKey;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderWorkout();
    }

    function checkProgression(exIndex) {
      const ex = routineData[activeTab].exercises[exIndex];
      let allMaxed = true;
      for (let s = 1; s <= ex.series; s++) {
        const repsInput = document.getElementById(`reps_${exIndex}_${s}`);
        if (!repsInput || parseInt(repsInput.value) < ex.maxReps) {
          allMaxed = false;
          break;
        }
      }
      const badgeEl = document.getElementById(`badge_${exIndex}`);
      if (badgeEl) {
        if (allMaxed) {
          badgeEl.className = "progression-badge badge-up";
          badgeEl.textContent = "SOBRECÀRREGA: Puja +2.5kg";
        } else {
          badgeEl.className = "progression-badge badge-keep";
          badgeEl.textContent = "MANTÉN PES";
        }
      }
    }

    function renderWorkout() {
      const data = routineData[activeTab];
      const container = document.getElementById('workout-content');

      let html = `
        <div class="workout-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px;">
            <div>
              <div style="font-size: 1.25rem; font-weight: 700;">${data.title}</div>
              <div style="font-size: 0.85rem; color: var(--text-muted);">${data.focus}</div>
            </div>
            <button class="btn btn-secondary" onclick="saveData()">Desa Localment</button>
          </div>
          <div style="overflow-x: auto;">
            <table class="exercise-table">
              <thead>
                <tr>
                  <th>Exercici</th>
                  <th>Pes (kg)</th>
                  <th>Sèries & Reps</th>
                  <th>RIR Real</th>
                  <th>Descans</th>
                  <th>Estat Progressió</th>
                </tr>
              </thead>
              <tbody>
      `;

      data.exercises.forEach((ex, exIdx) => {
        const savedData = getSavedData(activeTab, exIdx);
        html += `
          <tr>
            <td>
              <div style="font-weight: 600;">${ex.name}</div>
              <div style="font-size: 0.75rem; color: var(--text-muted);">${ex.series} Sèries x ${ex.targetReps} reps</div>
            </td>
            <td>
              <input type="number" id="weight_${exIdx}" value="${savedData.weight || ex.defaultWeight}" step="0.5" onchange="checkProgression(${exIdx})">
            </td>
            <td>
              <div style="display: flex; gap: 6px;">
        `;

        for (let s = 1; s <= ex.series; s++) {
          const val = savedData.reps ? savedData.reps[s-1] : '';
          html += `<input type="number" id="reps_${exIdx}_${s}" placeholder="S${s}" value="${val}" oninput="checkProgression(${exIdx})">`;
        }

        html += `
              </div>
            </td>
            <td>
              <select id="rir_${exIdx}">
                <option value="3" ${savedData.rir == 3 ? 'selected' : ''}>RIR 3</option>
                <option value="2" ${savedData.rir == 2 || !savedData.rir ? 'selected' : ''}>RIR 2</option>
                <option value="1" ${savedData.rir == 1 ? 'selected' : ''}>RIR 1</option>
                <option value="0" ${savedData.rir == 0 ? 'selected' : ''}>RIR 0</option>
              </select>
            </td>
            <td>
              <button class="btn btn-secondary" onclick="startTimer(${ex.rest})">⏱️ ${ex.rest}s</button>
            </td>
            <td>
              <span id="badge_${exIdx}" class="progression-badge badge-keep">MANTÉN PES</span>
            </td>
          </tr>
        `;
      });

      html += `
              </tbody>
            </table>
          </div>
          <div class="footer-actions">
            <button class="btn" onclick="saveData()">💾 Desa Registre Local</button>
            <button class="btn btn-drive" onclick="exportToCSV()">📂 Exporta CSV per a Google Drive</button>
          </div>
        </div>
      `;

      container.innerHTML = html;
      data.exercises.forEach((_, idx) => checkProgression(idx));
    }

    function saveData() {
      const sessionKey = `zenkai_${activeTab}`;
      const data = routineData[activeTab];
      const sessionPayload = [];

      data.exercises.forEach((ex, exIdx) => {
        const weight = document.getElementById(`weight_${exIdx}`).value;
        const rir = document.getElementById(`rir_${exIdx}`).value;
        const reps = [];
        for (let s = 1; s <= ex.series; s++) {
          reps.push(document.getElementById(`reps_${exIdx}_${s}`).value);
        }
        sessionPayload.push({ weight, reps, rir });
      });

      localStorage.setItem(sessionKey, JSON.stringify(sessionPayload));
      alert('🔥 Sessió guardada correctament al navegador.');
    }

    function getSavedData(tabKey, exIdx) {
      const raw = localStorage.getItem(`zenkai_${tabKey}`);
      if (!raw) return {};
      try {
        const parsed = JSON.parse(raw);
        return parsed[exIdx] || {};
      } catch (e) {
        return {};
      }
    }

    function exportToCSV() {
      let csvContent = "data:text/csv;charset=utf-8,Sessio,Exercici,Pes_kg,Semies_Reps,RIR_Real\n";
      Object.keys(routineData).forEach(tabKey => {
        const sessionName = routineData[tabKey].title;
        routineData[tabKey].exercises.forEach((ex, exIdx) => {
          const saved = getSavedData(tabKey, exIdx);
          const weight = saved.weight || ex.defaultWeight;
          const rir = saved.rir || 2;
          const repsStr = saved.reps ? saved.reps.join("-") : "";
          csvContent += `"${sessionName}","${ex.name}",${weight},"${repsStr}",${rir}\n`;
        });
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Zenkai_Performance_Log_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    renderWorkout();
  </script>
</body>
</html>
